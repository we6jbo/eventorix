app-id: io.github.eventorix.Eventorix
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: eventorix
modules:
  - name: eventorix
    buildsystem: simple
    build-commands:
      - install -Dm755 eventorix.py /app/bin/eventorix
    sources:
      - type: file
        path: ../eventorix.py
